# Type-checks and unit-tests the MCP server (mcp-server/) when it changes:
# pricing parity with the app, pairing codes, text cleaning. Needs no secrets.
name: MCP server CI

on:
  pull_request:
    paths:
      - "mcp-server/**"
      - ".github/workflows/mcp-server-ci.yml"
  push:
    branches:
      - main
    paths:
      - "mcp-server/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
