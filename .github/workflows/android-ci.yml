# Makes sure the Android app still builds and its unit tests pass, so a
# broken build is caught before it is merged. Needs no secrets (the build works without google-services.json).
name: Android CI

# Once per pull request (not again for the same commit's branch push), plus
# every merge into main so a broken main is noticed.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Accepts the SDK licences. Its default also installs the old "tools"
      # package, which Google removed - sdkmanager then fails the whole job.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
