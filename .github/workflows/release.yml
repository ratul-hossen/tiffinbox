# Builds the Android app and publishes a GitHub Release whenever a version
# tag is pushed, e.g.  git tag v1.2.0 && git push origin v1.2.0
# Full steps and the secrets it needs: docs/RELEASING.md
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches version.properties
        run: |
          VERSION=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME=$VERSION in version.properties"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Accepts the SDK licences. Its default also installs the old "tools"
      # package, which Google removed - sdkmanager then fails the whole job.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is missing - the app can't reach Firebase without it (see docs/RELEASING.md)"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Add signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.TIFFINBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "TIFFINBOX_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No signing key secret - shipping the debug-signed APK."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build APK
        env:
          TIFFINBOX_KEYSTORE_PASSWORD: ${{ secrets.TIFFINBOX_KEYSTORE_PASSWORD }}
          TIFFINBOX_KEY_ALIAS: ${{ secrets.TIFFINBOX_KEY_ALIAS }}
          TIFFINBOX_KEY_PASSWORD: ${{ secrets.TIFFINBOX_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "dist/TiffinBox-v$VERSION.apk"
          else
            ./gradlew :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "dist/TiffinBox-v$VERSION.apk"
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "See CHANGELOG.md" > dist/notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: TiffinBox v${{ env.VERSION }}
          body_path: dist/notes.md
          files: dist/TiffinBox-v${{ env.VERSION }}.apk
